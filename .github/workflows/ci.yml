name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Format check (black)
        run: black --check churn tests scripts
      - name: Lint (flake8)
        run: flake8 churn tests scripts
      - name: Tests
        run: pytest -q

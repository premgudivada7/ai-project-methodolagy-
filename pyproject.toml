[tool.poetry]
name = "retailgenius-churn"
version = "1.0.0"
description = "Customer churn prediction for RetailGenius (EPITA AI Project Methodology graded project)"
authors = ["Aravind Reddy Kolan", "Prem Siva Naga Sai Ram Kumar Gudivada", "Praveen Kumar Koppula"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "churn" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.1,<4"
numpy = ">=1.26,<3"
scikit-learn = ">=1.4,<2"
openpyxl = "^3.1"
matplotlib = "^3.8"
joblib = "^1.3"
mlflow = ">=2.16,<4"
shap = ">=0.45"

[tool.poetry.group.dev.dependencies]
black = "^24.3"
flake8 = "^7.0"
pylint = "^3.1"
pytest = "^8.0"
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"
python-docx = "^1.1"
jupyter = "^1.0"
xgboost = "^2.0"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["invalid-name", "too-many-locals", "too-many-arguments", "too-many-positional-arguments", "too-many-statements", "import-outside-toplevel", "wrong-import-position", "broad-exception-caught"]

[tool.pytest.ini_options]
testpaths = ["tests"]
